name: 'Deploy release to stage'

on:
    workflow_dispatch:
    push:
        branches: [release]
        paths-ignore:
            - docs/**
            - README.md
            - .github/**
            - cloudformation/**
            - db_scripts/**
            - jenkins/**
            - search-proxy/**
            - postgresql/**
            - cloudformation/tests/**
            - concordia/tests/**
            - exporter/tests/**
            - importer/tests/**

env:
    AWS_REGION: us-east-1

permissions:
    contents: read

jobs:
    deploy:
        name: Deploy Release to Stage
        runs-on: ubuntu-latest
        environment:
            name: stage

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  ref: release
                  fetch-depth: 0
                  fetch-tags: 'true'
                  persist-credentials: false

            - name: Get version from Git
              run: |
                  # Get latest version tag number (e.g. main was tagged in GitHub for this Release)
                  FULL_VERSION_NUMBER="$(git describe --tags `git rev-list --tags --max-count=1`)"
                  echo "version_number=$(echo "${FULL_VERSION_NUMBER}")" >> $GITHUB_ENV

            - name: configure aws credentials
              uses: aws-actions/configure-aws-credentials@v6.3.0
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build, tag and push docker images ECR
              env:
                  REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  IMAGE_TAG: ${{ secrets.IMAGE_TAG }}

              run: |
                  docker build --platform linux/amd64 -t $REGISTRY/concordia:$version_number -t $REGISTRY/concordia:$IMAGE_TAG .
                  docker build --platform linux/amd64 -t $REGISTRY/concordia/importer:$version_number -t $REGISTRY/concordia/importer:$IMAGE_TAG --file importer/Dockerfile .
                  docker build --platform linux/amd64 -t $REGISTRY/concordia/celerybeat:$version_number -t $REGISTRY/concordia/celerybeat:$IMAGE_TAG --file celerybeat/Dockerfile .

                  docker push --all-tags $REGISTRY/concordia
                  docker push --all-tags $REGISTRY/concordia/importer
                  docker push --all-tags $REGISTRY/concordia/celerybeat

            - name: Deploy to ECS
              env:
                  CLUSTER: ${{ secrets.CLUSTER }}
                  TARGET_SERVICE: ${{ secrets.TARGET_SERVICE }}
              run: |
                  aws ecs update-service --region ${{ env.AWS_REGION }} --force-new-deployment --cluster $CLUSTER --service $TARGET_SERVICE
