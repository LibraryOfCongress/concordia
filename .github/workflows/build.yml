name: 'Build'

on:
    workflow_dispatch:
    pull_request:
        branches: [main, 'feature-*', release]
        paths-ignore:
            - docs/**
            - README.md
            - .github/**
            - cloudformation/**
            - db_scripts/**
            - jenkins/**
            - search-proxy/**
            - postgresql/**

jobs:
    build:
        name: Build
        # Using runner with x64 architecture to match AWS Fargate default runtime environment
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: build containers
              run: |
                  docker build --platform linux/amd64 -t concordia .
                  docker build --platform linux/amd64 -t concordia/importer --file importer/Dockerfile .
                  docker build --platform linux/amd64 -t concordia/celerybeat --file celerybeat/Dockerfile .
